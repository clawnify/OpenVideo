  <rect width="64" height="64" rx="14" fill="#DF3656"/>
  <rect x="14" y="18" width="36" height="28" rx="4" fill="#fff"/>
  <path d="M29 27.5v9l8-4.5-8-4.5z" fill="#DF3656"/>
  <rect x="14" y="18" width="6" height="28" fill="#fff" fill-opacity="0.55"/>
  <rect x="44" y="18" width="6" height="28" fill="#fff" fill-opacity="0.55"/>
</svg>
